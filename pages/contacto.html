<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Grind Street</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <header class="header">
        <a href="../index.html" class="logo-link">
            <img src="../img/logo.svg" alt="Logo de Grind Street">
        </a>

        <nav>
            <ul class="navbar">
                <li><a href="../index.html#inicio">Inicio</a></li>
                <li><a href="../index.html#productos">Productos</a></li>
                <li><a href="../index.html#resenas">Reseñas</a></li>
                <li><a href="../index.html#multimedia">Multimedia</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto-section">
            <div class="contacto-info">
                <span>DEJANOS UN MENSAJE</span>
                <h1>Contacto</h1>
                <p>¿Tenés alguna consulta sobre nuestros productos? Escribinos y te respondemos.</p>
            </div>

            <div class="contacto-formulario">
                <form action="https://formspree.io/f/mppqdjkk" method="POST">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribí tu mensaje" required></textarea>

                    <button type="submit">Enviar mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div>
            <h3>Grind Street</h3>
            <p>Skate, calle y ganas de rodar.</p>
        </div>
        <div>
            <p>Volver al <a href="../index.html">inicio</a>.</p>
        </div>
    </footer>

</body>

</html>
